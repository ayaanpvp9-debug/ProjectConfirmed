<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7fb" />
    <meta
      name="description"
      content="ACADEMIA — a cinematic student workspace for homework, study planning, NCERT textbooks and server-graded mock tests."
    />
    <title>ACADEMIA — Student Workspace</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233f6bf0'/%3E%3Cstop offset='1' stop-color='%237a3ff0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%23f6f7fb'/%3E%3Cpath d='M32 14 50 50H41.5L32 29.5 22.5 50H14Z' fill='url(%23g)'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <!-- permanent atmosphere layers -->
    <div class="app-bg" aria-hidden="true">
      <span class="aurora aurora--blue"></span>
      <span class="aurora aurora--violet"></span>
      <span class="aurora aurora--cyan"></span>
      <span class="app-grid"></span>
      <span class="app-noise"></span>
      <span class="app-vignette"></span>
    </div>

    <main id="app" class="app-root"></main>

    <div id="modal-root"></div>
    <div id="toast-root" class="toast-stack" role="status" aria-live="polite"></div>

    <noscript>
      <div style="position: relative; z-index: 5; padding: 4rem; color: #0e1729; font-family: sans-serif">
        ACADEMIA needs JavaScript enabled to run.
      </div>
    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
